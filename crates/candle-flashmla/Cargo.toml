[package]
name = "candle-flashmla"
version.workspace = true
edition.workspace = true

[features]
default = []
cuda = ["dep:candle", "candle/cuda", "dep:float8", "float8/cuda", "dep:half"]

[dependencies]
candle = { git = "https://github.com/mixlayer/candle", package = "candle-core", branch = "fix/add-i16-i32-cuda-kernels", optional = true }
flashmla.workspace = true
float8 = { version = "0.6.0", optional = true }
half = { version = "2.4.1", optional = true }
